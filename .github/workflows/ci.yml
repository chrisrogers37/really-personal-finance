# The Node major below is pinned to a version inside its vendor support window.
# Support dates come from `nodejs/Release` `schedule.json`, the vendor's own
# published schedule, rather than a secondary source. Node 22 leaves support on
# 2027-04-30.
#
# This pin governs CI only. The deployed runtime is set by the Vercel project
# and is not declared in this repository, so the two can differ; the mechanism
# for declaring it once is an open decision in
# `policies/eol-software-policy.md` Section 8.2.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Blocks a production-reachable CRITICAL advisory from entering the tree.
  #
  # Scope is deliberately narrow, and the narrowness is the point: this is the
  # widest audit gate that passes on a clean tree today, so it blocks only on a
  # genuine regression rather than on the existing backlog. Widening it is
  # blocked on the dependency work in #137 -- `--audit-level=high` is currently
  # red with 5 production advisories, so gating there would fail every PR
  # regardless of what the PR changed, and a gate that always fails is a gate
  # everyone learns to ignore.
  #
  # `--omit=dev` because a dev-only advisory does not ship: it cannot be reached
  # by the deployed app, and blocking releases on the test runner's dependency
  # tree trains people to bypass the gate.
  #
  # `--package-lock-only` because the lockfile is what `npm ci` installs, so
  # auditing it audits exactly what ships -- without paying for an install.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --package-lock-only --omit=dev --audit-level=critical

  # Blocks a type error from entering the tree. `tsc --noEmit` is green on main,
  # so this fails only on a regression rather than on an existing backlog.
  #
  # Separate job rather than a step in `test` so a type error stays attributable
  # and does not mask the suite result -- the two answer different questions and
  # a reviewer should be able to see both at once.
  #
  # Lint is deliberately NOT gated here. It is red with 9 errors, 8 of them
  # react-hooks/set-state-in-effect across 8 UI files. Clearing those means
  # extracting a shared data-fetching hook -- a runtime refactor in a repo with
  # no UI tests -- so gating it today would fail every PR regardless of what the
  # PR changed. A gate that always fails is one people learn to bypass.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
